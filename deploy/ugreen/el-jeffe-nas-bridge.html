<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EL JEFFE NAS Bridge</title>
<style>
:root{color-scheme:dark;background:#090b10;color:#f3f5f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1100px;margin:auto}
h1{font-size:clamp(2rem,6vw,4.5rem);margin:.15em 0}.muted{color:#aab2c0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:24px}
.card{padding:20px;border:1px solid #29303c;border-radius:18px;background:#11151d;color:inherit}
.card b{display:block;font-size:1.08rem;margin-bottom:6px}.tag{font-size:.75rem;border:1px solid #394153;border-radius:99px;padding:3px 8px;display:inline-block}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button,input{background:#11151d;color:#fff;border:1px solid #394153;border-radius:10px;padding:10px 12px}input{min-width:280px;flex:1}
a{color:#b8d7ff}
</style>
</head>
<body>
<div class="tag">ELJEFFETV · 192.168.1.222</div>
<h1>NAS Control</h1>
<p class="muted">Local links work on your home network. After Cloudflare Tunnel is configured, enter the base domain below to enable HTTPS remote links.</p>
<div class="controls">
<input id="domain" placeholder="Base domain, e.g. example.com">
<button id="save">Save remote base</button>
</div>
<div id="grid" class="grid"></div>
<script>
const services=[
 ["homarr","NAS Dashboard",7575,"homarr"],
 ["jellyfin","Movies & TV",8096,"watch"],
 ["navidrome","Music",4533,"music"],
 ["audiobookshelf","Audiobooks & Podcasts",13378,"audio"],
 ["kavita","E-books, Comics & Magazines",5000,"read"],
 ["dispatcharr","TV & EPG Manager",9191,"tv"]
];
const key="eljeffe.remoteBase";
const input=document.getElementById("domain");
input.value=localStorage.getItem(key)||"";
document.getElementById("save").onclick=()=>{localStorage.setItem(key,input.value.trim());render()};
function render(){
 const base=(localStorage.getItem(key)||"").replace(/^https?:\/\//,"").replace(/\/$/,"");
 document.getElementById("grid").innerHTML=services.map(function(s){
   const id=s[0],label=s[1],port=s[2],sub=s[3];
   const local="http://192.168.1.222:"+port;
   const remote=base?("https://"+sub+"."+base):"";
   return '<div class="card"><b>'+label+'</b><div class="muted">'+id+'</div><p><a href="'+local+'" target="_blank" rel="noreferrer">Open local</a>'+(remote?' · <a href="'+remote+'" target="_blank" rel="noreferrer">Open remote</a>':'')+'</p></div>';
 }).join("");
}
render();
</script>
</body>
</html>
